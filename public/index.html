<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon-64.png" type="image/png" sizes="64x64" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon-64.png" />

  <title>Girish BR | Frontend Developer Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />

  <!-- SEO Meta Tags -->
  <meta name="robots" content="index, follow" />
  <meta name="title" content="Girish BR | Frontend Developer Portfolio" />
  <meta name="description"
    content="Portfolio of Girish BR, React.js Frontend Developer with 6 years of experience building modern, responsive, and scalable web applications. Explore my projects, skills, and resume." />
  <meta name="keywords"
    content="Girish BR, React Developer, Frontend Developer, Portfolio, Bangalore, Web Development, JavaScript, TypeScript, UI Developer, React.js, CSS, HTML, Chakra UI" />
  <meta name="author" content="Girish BR" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://girish-br.github.io/my-portfolio/" />

  <!-- Manifest -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://girish-br.github.io/my-portfolio/" />
  <meta property="og:title" content="Girish BR | GitHub Portfolio & Frontend Developer" />
  <meta property="og:description"
    content="Portfolio of Girish BR, React.js Frontend Developer with 6 years of experience." />
  <meta property="og:image" content="https://girish-br.github.io/my-portfolio/preview.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://girish-br.github.io/my-portfolio/" />
  <meta property="twitter:title" content="Girish BR | Frontend Developer Portfolio" />
  <meta property="twitter:description"
    content="Portfolio of Girish BR, React.js Frontend Developer with 6 years of experience." />
  <meta property="twitter:image" content="https://girish-br.github.io/my-portfolio/preview.png" />

  <!-- Structured Data: Person -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Girish B R",
    "alternateName": [
      "Girish BR Portfolio",
      "Girish BR GitHub Portfolio",
      "Girish BR React Developer"
    ],
    "url": "https://girish-br.github.io/my-portfolio/",
    "image": "https://girish-br.github.io/my-portfolio/preview.png",
    "sameAs": [
      "https://www.linkedin.com/in/girish-br", 
      "https://github.com/girish-br"
    ],
    "jobTitle": "Frontend Developer",
    "worksFor": {
      "@type": "Organization",
      "name": "Freelance / Open to Opportunities"
    }
  }
  </script>

  <!-- Structured Data: Website -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Girish BR Portfolio",
    "url": "https://girish-br.github.io/my-portfolio/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://girish-br.github.io/my-portfolio/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
