<!-- 404.html for GitHub Pages SPA redirect -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=./">
    <script type="text/javascript">
      // If JavaScript is enabled, use it to preserve the path
      var redirectTo = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
      var hash = window.location.hash;
      var search = window.location.search;
      var path = window.location.pathname.replace(/^\/my-portfolio/, '');
      window.location.replace(window.location.origin + '/my-portfolio/' + '#' + path + search + hash);
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
    <p>If you are not redirected, <a href="./">click here</a>.</p>
  </body>
</html>
